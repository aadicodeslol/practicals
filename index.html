const container = document.getElementById("questions");
function esc(s){
  return s.replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}
function render(){
  const query = document.getElementById("search").value.toLowerCase();
  container.innerHTML = "";
  data.forEach((item,index)=>{
    const text = item.q + " " + item.parts.map(p=>p.join(" ")).join(" ");
    if(!text.toLowerCase().includes(query)) return;
    const details = document.createElement("details");
    details.open = query.length > 0;
    const summary = document.createElement("summary");
    summary.textContent = item.q;
    details.appendChild(summary);
    item.parts.forEach(part=>{
      const section = document.createElement("section");
      section.className = "answer";
      const title = document.createElement("h3");
      title.textContent = part[0];
      section.appendChild(title);
      const pre = document.createElement("pre");
      const code = document.createElement("code");
      code.textContent = part[1];
      pre.appendChild(code);
      section.appendChild(pre);
      const actions = document.createElement("div");
      actions.className = "actions";
      const btn = document.createElement("button");
      btn.textContent = "Copy code";
      btn.onclick = async()=>{
        try{
          await navigator.clipboard.writeText(part[1]);
          btn.textContent = "Copied!";
          setTimeout(()=>btn.textContent="Copy code",1200);
        }catch(e){
          const area = document.createElement("textarea");
          area.value = part[1];
          document.body.appendChild(area);
          area.select();
          document.execCommand("copy");
          area.remove();
          btn.textContent = "Copied!";
          setTimeout(()=>btn.textContent="Copy code",1200);
        }
      };
      actions.appendChild(btn);
      section.appendChild(actions);
      details.appendChild(section);
    });
    container.appendChild(details);
  });
}
document.getElementById("search").addEventListener("input",render);
render();
</script>
