const list = document.querySelector("#list");
const q = document.querySelector("#q");
const view = document.querySelector("#view");
const count = document.querySelector("#count");
let selected = 0;

function esc(s) {
  return s.replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;",
    '"':"&quot;", "'":"&#39;"
  }[c]));
}
function draw() {
  const matches = programs.map((p,i)=>({p,i}))
    .filter(x=>x.p.join(" ").toLowerCase().includes(q.value.toLowerCase()));
  list.innerHTML = "";
  matches.forEach(x=>{
    const b = document.createElement("button");
    b.textContent = x.p[0];
    if (x.i === selected) b.className = "on";
    b.onclick = ()=>show(x.i);
    list.appendChild(b);
  });
  count.textContent = matches.length + " / " + programs.length + " programs";
  if (!matches.length) list.textContent = "No matches";
}
function show(i) {
  selected = i;
  view.innerHTML = "<h2>"+esc(programs[i][0])+"</h2><pre><code>"+esc(programs[i][1])+"</code></pre>";
  draw();
}
q.oninput = draw;
document.querySelector("#copy").onclick = async()=>{
  try {
    await navigator.clipboard.writeText(programs[selected][1]);
    document.querySelector("#copy").textContent = "Copied!";
  } catch(e) {
    alert("Select the code and copy it manually.");
  }
};
show(0);
